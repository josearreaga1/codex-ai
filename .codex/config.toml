# Shared Codex project configuration lives here.
# Expand this file with local environment setup and common actions that
# should be available to everyone working in this repository.
model = "gpt-5.4"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[project]
name = "codex-ai"
description = "Codex + GitHub + Azure DevOps MCP experiment"

[mcp_servers.workkb]
url = "https://simpler-mcp.azurewebsites.net"

[environment]
shell = "powershell"

[actions.explain_repo]
command = "git status"

[actions.show_branches]
command = "git branch -a"

[actions.sync]
command = "git fetch --all --prune"

[actions.last_commits]
command = "git log --oneline -5"